<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Chat</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1c1f24;--mut:#6b7280;--ac:#4f46e5;--bd:#e5e7eb;--err:#b91c1c;--errbg:#fef2f2}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--fg:#e8eaed;--mut:#9aa1ad;--ac:#818cf8;--bd:#2a2f38;--err:#fca5a5;--errbg:#2a1517}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;max-width:760px;margin:0 auto}
header{padding:14px 16px;border-bottom:1px solid var(--bd)}
header h1{font-size:17px;margin:0}header small{color:var(--mut)}
details{margin-top:8px}summary{cursor:pointer;color:var(--mut);font-size:13px}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.user{align-self:flex-end;background:var(--ac);color:#fff}
.assistant{align-self:flex-start;background:var(--card);border:1px solid var(--bd)}
.error{align-self:center;background:var(--errbg);color:var(--err);border:1px solid var(--err);font-size:14px}
.meta{margin-top:8px;padding-top:6px;border-top:1px dashed var(--bd);display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mut)}
.badge{font-weight:600;padding:0 6px;border-radius:6px;background:var(--bd);color:var(--fg)}
.badge.LLM_CACHE{background:#16a34a;color:#fff}.badge.LIVE_INFERENCE{background:#2563eb;color:#fff}
footer{padding:12px 16px;border-top:1px solid var(--bd);display:flex;gap:8px}
textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%;resize:none}
#chat-input{flex:1}
button{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:0 20px;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
</style>
</head>
<body>
<header>
  <h1>AI Chat <small id="sid"></small></h1>
  <details><summary>System prompt (optional)</summary>
    <textarea id="sys" data-testid="system-prompt-input" rows="2" placeholder="e.g. You are a pirate. Answer in pirate speak."></textarea>
  </details>
</header>
<div id="chat"></div>
<footer>
  <textarea id="inp" data-testid="chat-input" rows="2" placeholder="Type a message… (Enter to send, Shift+Enter for newline)"></textarea>
  <button id="btn" data-testid="send-button">Send</button>
</footer>
<script src="config.js"></script>
<script>
const API = (location.hostname.endsWith("vercel.app") ? "https://ai-chat-litellm.onrender.com" : (window.API_URL || "http://localhost:8000")).replace(/\/$/, "");
const sessionId = "s-" + (crypto.randomUUID ? crypto.randomUUID().slice(0, 8) : Math.random().toString(16).slice(2, 10));
const chat = document.getElementById("chat"), inp = document.getElementById("inp"),
      btn = document.getElementById("btn"), sys = document.getElementById("sys");
document.getElementById("sid").textContent = "· session " + sessionId;

function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls; d.textContent = text;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
}
function span(testid, text, cls) {
  const s = document.createElement("span");
  s.dataset.testid = testid; s.textContent = text; if (cls) s.className = cls; return s;
}
function label(t, el) {
  const w = document.createElement("span"); w.append(t + " ", el); return w;
}
function addAssistant(reply, m) {
  const d = add("assistant", reply);
  d.dataset.testid = "assistant-message";
  const meta = document.createElement("div"); meta.className = "meta";
  meta.append(
    label("source", span("meta-source", m.resolution_source, "badge " + m.resolution_source)),
    label("model", span("meta-model", m.model)),
    label("latency", span("meta-latency", m.latency_ms + " ms")),
    label("in", span("meta-input-tokens", String(m.input_tokens))),
    label("out", span("meta-output-tokens", String(m.output_tokens)))
  );
  d.appendChild(meta); chat.scrollTop = chat.scrollHeight;
}
function errText(status, body) {
  if (status === 503) return "All AI providers are currently unavailable. Please try again in a moment.";
  if (status === 422) return "Invalid input: your message must be 1–4000 characters.";
  const d = body && body.detail;
  return "Error " + status + ": " + (typeof d === "string" ? d : "something went wrong.");
}
async function send() {
  const message = inp.value.trim();
  if (!message || btn.disabled) return;
  add("user", message); inp.value = ""; btn.disabled = true;
  const body = { session_id: sessionId, message };
  if (sys.value.trim()) body.system_prompt = sys.value.trim();
  const typing = add("assistant", "…");
  try {
    const res = await fetch(API + "/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    let data = null; try { data = await res.json(); } catch (_) {}
    typing.remove();
    if (res.ok && data) addAssistant(data.reply, data.metadata);
    else add("error", errText(res.status, data));
  } catch (e) {
    typing.remove(); add("error", "Cannot reach the server. Check your connection and try again.");
  } finally { btn.disabled = false; inp.focus(); }
}
btn.addEventListener("click", send);
inp.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
</script>
</body>
</html>
