services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/app.db
    volumes:
      - appdata:/data
  frontend:
    build:
      context: ./frontend
      args:
        API_URL: ${API_URL:-http://localhost:8000}
    ports: ["3000:80"]
    depends_on: [backend]
volumes:
  appdata:
